ite, Power BI, Google Таблицы","Проверено живым открытием: 114 568 проводок и 74 751 документ банка и кассы за 2020-2026. Баланс укрупнённый"],["9","Сверка выручки сети моек","Заказ, оплата, чек ОФД, эквайринг, выплата банка, расчётный счёт и 1С сверялись в хрупком Power Query","Единая цепочка: заказ → оплата → чек ОФД → эквайринг/СБП → выплата банка → р/с → 1С, расхождения видны сразу","Python, SQLite, ОФД, эквайринг","Пилот (MVP), не готовый продукт"],["10","Контроль договоров в 1С","Договор в документе не совпадает с назначением платежа, номера теряются, нет контроля сроков","Обработка проверяет документы по договору: статусы «привязать», «расхождение», «совпало», фильтры, сортировка, переход в документ двойным кликом","Внешний отчёт .epf, 1С 8.3","Опубликовано на Инфостарте, приёмка на копиях баз"],["11","Комиссия эквайринга под счёт-фактуру","Комиссию банка раскладывали вручную по эквайринговым отчётам","Расчёт и отражение комиссии под счёт-фактуру, живая приёмка на 8.3 и 8.5","Внешняя обработка .epf","31 проверка пройдена на 8.3 и 8.5, на модерации Инфостарта"],["12","Заполнение контрагентов по ИНН пачкой","Карточки контрагентов правили по одной, написание названий разное","Пачкой по ИНН: показывает «было → станет» до записи, отмена в 1 клик","Внешняя обработка .epf","Скриншоты на 8.3 и 8.5, на модерации Инфостарта"]]}</script>
<script>/* Универсальная панель управления: данные внутри файла, фильтры (период, отрасль, юрлицо) пересчитывают всё.
   Три уровня: плитки входа -> раздел с аналитикой -> таблицы-инструменты с записями. */
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('data').textContent);
  var N = D.n, ENT = D.ents, LINES = D.lines, SER = D.series, STA = D.static, REC = D.rec;

    if (a >= 1e3) return s + Math.round(a / 1e3) + ' тыс';

  function ddmm(iso) { return iso.slice(8, 10) + '.' + iso.slice(5, 7); }
  function dmy(iso) { return iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.' + iso.slice(0, 4); }
  function sum(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; }
  function clip(s, k) { s = String(s); return s.length <= k ? s : s.slice(0, k - 1) + '…'; }
  function dl(x, goodUp) {
    if (Math.abs(x) < 0.005) return '<span class="dl flat">→ без изм.</span>';
    var up = x > 0, good = (up === (goodUp !== false));
    return '<span class="dl ' + (good ? 'good' : 'bad') + '">' + (up ? '▲' : '▼') + ' ' + pc(x) + '</span>';
  }
  var RANK = { crit: 3, warn: 2, na: 1, ok: 0 };
  var ST_TXT = { ok: 'чисто', warn: 'проверить', crit: 'риск', na: 'не удалось проверить' };
  function badge(st) { return '<span class="rs ' + st + '">' + ST_TXT[st] + '</span>'; }

  /* ---------- состояние ---------- */
  function load() {
    try { var o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o) { for (var k in S) if (k in o) S[k] = o[k]; } } catch (e) { /* закрыто */ }
    var h = new URLSearchParams(location.hash.slice(1));
    if (h.get('per')) S.per = h.get('per');
    if (h.get('from')) S.from = h.get('from');
    if (h.get('to')) S.to = h.get('to');
    if (h.get('l')) S.lines = h.get('l').split(',').filter(Boolean).map(Number);
    if (h.get('e') !== null && h.get('e') !== undefined) S.ents = h.get('e').split(',').filter(Boolean).map(Number);
    S.v = h.get('v') || '';
    if (!S.lines.length) S.lines = [0, 1, 2, 3];
  }
  function save(push) {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* закрыто */ }
    var p = new URLSearchParams();
    if (S.v) p.set('v', S.v);
    p.set('per', S.per);
    if (S.per === 'custom') { p.set('from', S.from); p.set('to', S.to); }
    if (S.lines.length !== LINES.length) p.set('l', S.lines.join(','));
    if (S.ents.length) p.set('e', S.ents.join(','));
    var url = '#' + p.toString();
    if (push) history.pushState(null, '', url); else history.replaceState(null, '', url);
  }
  function range() {
    var b = N - 1, a, len;
    if (S.per === 'custom' && S.from && S.to) {
      a = D.dates.indexOf(S.from); b = D.dates.indexOf(S.to);
      if (a < 0) a = 0; if (b < 0) b = N - 1; if (a > b) { var t = a; a = b; b = t; }

    len = b - a + 1;

    return { a: a, b: b, len: len, pa: pa >= 0 ? pa : null, pb: a - 1 };
  }
  function selEnts() {

    if (S.ents.length) {

      var f = es.filter(function (e) { return ss[e.id]; });

  /* ---------- агрегаты ---------- */
  function rs(e, key, a, b) { var arr = SER[e.id][key], s = 0; for (var i = a; i <= b; i++) s += arr[i]; return s; }
  function tot(es, key, a, b) { var s = 0; es.forEach(function (e) { s += rs(e, key, a, b); }); return s; }
  function dailySum(es, key, a, b) {

    es.forEach(function (e) { var arr = SER[e.id][key]; for (var i = a; i <= b; i++) out[i - a] += arr[i]; });

  }
  function metrics() {
    var R = range(), es = selEnts(), M = { R: R, es: es };
    function block(a, b) {
      var o = {};
      ['rev', 'cogs', 'pay', 'rent', 'oth', 'tax', 'sup', 'inf', 'plan', 'tru', 'late', 'sick', 'vac', 'capex', 'finIn', 'finOut'].forEach(function (k) { o[k] = tot(es, k, a, b); });
      o.opex = o.pay + o.rent + o.oth; o.gross = o.rev - o.cogs; o.ebit = o.gross - o.opex; o.net = o.ebit - o.tax;

      return o;
    }
    M.c = block(R.a, R.b);
    M.p = R.pa !== null ? block(R.pa, R.pb) : null;
    M.delta = M.p && M.p.rev ? M.c.rev / M.p.rev - 1 : 0;
    M.margin = M.c.rev ? M.c.net / M.c.rev : 0;
    M.gm = M.c.rev ? M.c.gross / M.c.rev : 0;
    /* остаток: открывающий + нарастающий поток */
    var bal = [], b0 = 0; es.forEach(function (e) { b0 += SER[e.id].b0; });
    var cum = b0;
    var infAll = dailySum(es, 'inf', 0, N - 1), supAll = dailySum(es, 'sup', 0, N - 1), payAll = dailySum(es, 'pay', 0, N - 1),
      rentAll = dailySum(es, 'rent', 0, N - 1), othAll = dailySum(es, 'oth', 0, N - 1), taxAll = dailySum(es, 'tax', 0, N - 1);
    var capAll = dailySum(es, 'capex', 0, N - 1), fiAll = dailySum(es, 'finIn', 0, N - 1), foAll = dailySum(es, 'finOut', 0, N - 1);
    for (var i = 0; i < N; i++) { cum += infAll[i] - supAll[i] - payAll[i] - rentAll[i] - othAll[i] - taxAll[i] - capAll[i] + fiAll[i] - foAll[i]; bal.push(cum); }
    M.bal = bal;
    M.open = R.a > 0 ? bal[R.a - 1] : b0;
    M.close = bal[R.b];
    M.inSum = sum(infAll.slice(R.a, R.b + 1));
    M.outSum = M.c.out;
    M.revDaily = dailySum(es, 'rev', R.a, R.b);
    M.revPrevDaily = M.p ? dailySum(es, 'rev', R.pa, R.pb) : null;
    /* сегменты */
    M.segs = [];
    es.forEach(function (e) {
      var L = LINES[e.line];
      L.segs.forEach(function (name, s) {
        var arr = SER[e.id].seg[s], c = 0, p = 0;
        for (var i = R.a; i <= R.b; i++) c += arr[i];
        if (R.pa !== null) for (var j = R.pa; j <= R.pb; j++) p += arr[j];
        var key = e.line + ':' + s, f = null;
        for (var k = 0; k < M.segs.length; k++) if (M.segs[k].key === key) f = M.segs[k];
        if (!f) { f = { key: key, name: name, line: e.line, s: s, c: 0, p: 0, g: 0 }; M.segs.push(f); }
        f.c += c; f.p += p; f.g += c * SER[e.id].mg[s];
      });
    });
    M.segs.forEach(function (x) { x.d = x.p ? x.c / x.p - 1 : 0; x.m = x.c ? x.g / x.c : 0; });
    M.multiLine = S.lines.length > 1;
    M.lineAgg = [];
    S.lines.forEach(function (li) {
      var c = 0, p = 0;
      M.segs.forEach(function (x) { if (x.line === li) { c += x.c; p += x.p; } });
      M.lineAgg.push({ name: LINES[li].n, label: LINES[li].n, c: c, p: p, d: p ? c / p - 1 : 0 });
    });
    /* люди */
    M.H = 0; es.forEach(function (e) { M.H += e.H; });
    var avail = M.c.plan - M.c.vac;
    M.att = avail > 0 ? 1 - (M.c.tru + M.c.sick) / avail : 1;
    /* статичные на дату */
    var due = [], ens = 0, arb = [0, 0, 0, 0], apb = [0, 0, 0, 0], stock = [], nxt = [], debs = [], emp = [];
    es.forEach(function (e) {
      var st = STA[e.id];
      st.due.forEach(function (d) { due.push([d[0], d[1], d[2], e.n]); });
      ens += st.ens;
      for (var i = 0; i < 4; i++) { arb[i] += st.ar[i]; apb[i] += st.ap[i]; }
      st.stock.forEach(function (x) { stock.push([x[0], x[1], x[2], x[3], e.n]); });
      st.nxt.forEach(function (x) { nxt.push([x[0], x[1], x[2], e.n]); });
      st.deb.forEach(function (x) { debs.push([x[0], x[1], e.n]); });
    });
    M.fa = 0; M.loan = 0; es.forEach(function (e) { M.fa += STA[e.id].fa; M.loan += STA[e.id].loan; });
    M.due = due; M.dueTot = due.reduce(function (s, x) { return s + x[2]; }, 0); M.ens = ens; M.gap = M.dueTot - ens;

    M.stock = stock; M.stockVal = stock.reduce(function (s, x) { return s + x[2]; }, 0);
    M.def = stock.filter(function (x) { return x[3] <= 7; });
    M.nxt = nxt; M.nxtSum = nxt.reduce(function (s, x) { return s + x[2]; }, 0);
    M.debs = debs;
    var d14m = Math.max(0, R.b - 13), n14m = R.b - d14m + 1;
    M.aIn = tot(es, 'inf', d14m, R.b) / n14m;
    M.aReg = (tot(es, 'oth', d14m, R.b) + tot(es, 'tax', d14m, R.b)) / n14m;
    M.cover = M.close + (M.aIn - M.aReg) * 14 - M.nxtSum;
    var wk = M.c.out / (R.len / 7);

  /* ---------- графика ---------- */

  /* ---------- таблица-инструмент ---------- */

    if (t.hasAttribute('data-ent')) {
      var es = ENT.filter(function (e) { return S.lines.indexOf(e.line) >= 0; }).map(function (e) { return e.id; });
      var cur = S.ents.length ? S.ents.slice() : es.slice();
      var id = Number(t.getAttribute('data-ent'));
      if (t.checked) { if (cur.indexOf(id) < 0) cur.push(id); } else cur = cur.filter(function (x) { return x !== id; });
      if (!cur.length) cur = [id];
      if (cur.length === es.length) cur = [];
      OPEN = 'ents'; setState({ ents: cur.sort(function (a, b) { return a - b; }) }, false); return;
    }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.classList && t.classList.contains('tf')) {
      var box = t.closest('.dt'), id = box.getAttribute('data-t'); TST[id].q = t.value;
      var pos = t.selectionStart; box.innerHTML = drawTable(id);
      var ni = box.querySelector('.tf'); ni.focus(); try { ni.setSelectionRange(pos, pos); } catch (e) { /* нет */ }
    }
  });
  window.addEventListener('popstate', function () { load(); render(); });
  document.addEventListener('keydown', function (ev) {
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute && ev.target.getAttribute('data-go') !== null && ev.target.classList.contains('t')) {
      ev.preventDefault(); setState({ v: ev.target.getAttribute('data-go') }, true);
    }
    if (ev.key === 'Escape' && OPEN) { OPEN = ''; render(); }
  });

  load();
  save(false);
  render();
})();
</script></body></html>
